name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release packaging
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir "$root/tarballs"

          # A release publishes one package, but CI packs every one of them: a change to the
          # release machinery must not pass by working for a single package.
          mapfile -t tags < <(node scripts/verify-release.mjs | jq -r '.packages[].tag')
          test "${#tags[@]}" -gt 0

          for tag in "${tags[@]}"; do
            directory="$root/$(printf '%s' "$tag" | tr '/@' '__')"
            pnpm pack:release -- --tag "$tag" "$directory"
            (cd "$directory" && sha256sum -c SHA256SUMS)
            node scripts/verify-release-artifacts.mjs \
              --tag "$tag" \
              --directory "$directory"
            cp "$directory"/*.tgz "$root/tarballs/"
          done

          # Dependencies come from the packed tarballs rather than npm. A release resolves them
          # from the registry instead, so that publishing a package ahead of its dependency
          # fails; on a pull request there is nothing published yet to resolve against.
          for tag in "${tags[@]}"; do
            directory="$root/$(printf '%s' "$tag" | tr '/@' '__')"
            node scripts/check-release-install.mjs \
              --tag "$tag" \
              --directory "$directory" \
              --dependencies "$root/tarballs"
          done
