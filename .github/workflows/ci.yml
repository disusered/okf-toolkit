name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release packaging
        run: |
          release_directory="$(mktemp -d)"
          release_tag="v$(jq -r '.version' package.json)"
          pnpm pack:release -- "$release_directory"
          (cd "$release_directory" && sha256sum -c SHA256SUMS)
          node scripts/verify-release-artifacts.mjs \
            --tag "$release_tag" \
            --directory "$release_directory"
          node scripts/check-release-install.mjs \
            --tag "$release_tag" \
            --directory "$release_directory"
